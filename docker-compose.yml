services:
  env:
    build: .
    network_mode: host
    volumes:
      - .:/mnt/delivery
    working_dir: /mnt/delivery
    stdin_open: true
    tty: true

  lint:
    image: ghcr.io/super-linter/super-linter:slim-v6
    environment:
      - RUN_LOCAL=true
      - VALIDATE_ALL_CODEBASE=true
      - DEFAULT_BRANCH=main
    volumes:
      - .:/tmp/lint
